# Builds the mod and attaches the resulting jars to a GitHub Release whenever
# one is published — a Release on its own only contains the auto-generated
# source code zip/tar.gz, never the compiled jar.

name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-jars:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: upload jars to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/*.jar --clobber
